# Render Blueprint for the InspectFlow API (free web service).
# Create it from the Render dashboard: New > Blueprint > pick this repository.
# Values marked "sync: false" are asked for once in the dashboard and never
# stored in Git. See docs/DEPLOYMENT.md for the full walkthrough.
# One-time demo data: set the dashboard env var RUN_SEED=true to run the seed
# on the next boot, then set it back to false (it resets demo data each run).
services:
  - type: web
    name: inspectflow-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm --filter @inspectflow/api build
    # Apply database migrations, then start. Migrations are idempotent.
    startCommand: cd apps/api && npx prisma migrate deploy && if [ "$RUN_SEED" = "true" ]; then npx ts-node -r tsconfig-paths/register prisma/seed.ts; fi && node dist/main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Supabase or Neon direct connection string
        sync: false
      - key: PUBLIC_API_URL # the URL Render gives this service, e.g. https://inspectflow-api.onrender.com
        sync: false
      - key: FRONTEND_URL # the Vercel URL of the dashboard
        sync: false
      - key: CORS_ORIGINS # same Vercel URL (comma separated if several)
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: inspectflow-screenshots
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
