name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inspectflow
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: inspectflow_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U inspectflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://inspectflow@127.0.0.1:5433/inspectflow_test
      DATABASE_URL: postgresql://inspectflow@127.0.0.1:5433/inspectflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - name: API type-check, lint and tests
        run: |
          pnpm --filter @inspectflow/api exec tsc --noEmit
          pnpm --filter @inspectflow/api lint
          pnpm --filter @inspectflow/api test
      - name: Widget type-check and tests
        run: |
          pnpm --filter @inspectflow/widget lint
          pnpm --filter @inspectflow/widget test
      - name: Production builds
        run: |
          pnpm --filter @inspectflow/api build
          pnpm --filter @inspectflow/web build
          pnpm --filter @inspectflow/staging build
