name: Keep demo awake

# Free hosting sleeps when idle: Render stops the API after 15 minutes and
# Supabase pauses a free project after a week without activity. Calling /health
# once a day wakes the API and runs a database query, which counts as activity.
# Set the repository variable API_URL (Settings > Secrets and variables >
# Actions > Variables) to enable it. Without the variable the job does nothing.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Call the health endpoint (retries while the API wakes up)
        run: curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 "${{ vars.API_URL }}/health"
