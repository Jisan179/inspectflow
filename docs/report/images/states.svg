<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs><marker id="a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#44516e"/></marker></defs>
  <rect width="1500" height="760" fill="white"/>
  <text x="750" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f2a44">Ticket lifecycle</text><circle cx="60" cy="150" r="9" fill="#1f2a44"/><rect x="130" y="120" width="190" height="60" rx="26" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/><text x="225" y="155" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2a44">OPEN</text><rect x="450" y="120" width="190" height="60" rx="26" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/><text x="545" y="155" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2a44">IN_PROGRESS</text><rect x="790" y="120" width="190" height="60" rx="26" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/><text x="885" y="155" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2a44">RESOLVED</text><rect x="1130" y="120" width="190" height="60" rx="26" fill="#e4f6ea" stroke="#1f2a44" stroke-width="2"/><text x="1225" y="155" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2a44">VERIFIED</text><path d="M 69 150 L 130 150" fill="none" stroke="#44516e" stroke-width="2" marker-end="url(#a)"/><rect x="70.2" y="124" width="59.6" height="20" fill="white"/><text x="100" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">created</text><path d="M 320 140 L 450 140" fill="none" stroke="#44516e" stroke-width="2" marker-end="url(#a)"/><rect x="345" y="114" width="80" height="20" fill="white"/><text x="385" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">start work</text><path d="M 640 140 L 790 140" fill="none" stroke="#44516e" stroke-width="2" marker-end="url(#a)"/><rect x="685.2" y="114" width="59.6" height="20" fill="white"/><text x="715" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">resolve</text><path d="M 980 140 L 1130 140" fill="none" stroke="#44516e" stroke-width="2" marker-end="url(#a)"/><rect x="1015" y="114" width="80" height="20" fill="white"/><text x="1055" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">verify fix</text><text x="385" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1f2a44">Developer / Lead</text><text x="715" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1f2a44">Developer / Lead, or merged PR (GitHub)</text><text x="1055" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1f2a44">Tester / Client, Lead</text><path d="M 885 180 C 885 320 225 320 225 180" fill="none" stroke="#44516e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="447" y="270" width="216" height="20" fill="white"/><text x="555" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">reopen (Tester / Client, Lead)</text><path d="M 1225 180 C 1225 420 175 420 175 180" fill="none" stroke="#44516e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="530.8" y="335" width="338.4" height="20" fill="white"/><text x="700" y="349" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">reopen a verified ticket (Tester / Client, Lead)</text><path d="M 545 180 C 545 250 280 250 280 180" fill="none" stroke="#44516e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="298.6" y="211" width="222.79999999999998" height="20" fill="white"/><text x="410" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">back to Open (Developer / Lead)</text><text x="750" y="395" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-style="italic" fill="#44516e">Open and In progress High / Blocker tickets block build approval until they are Verified.</text><text x="750" y="450" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f2a44">Build lifecycle and client sign-off</text><circle cx="60" cy="570" r="9" fill="#1f2a44"/><rect x="130" y="540" width="190" height="60" rx="26" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/><text x="225" y="575" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2a44">DRAFT</text><rect x="520" y="540" width="220" height="60" rx="26" fill="#eef1f8" stroke="#1f2a44" stroke-width="2"/><text x="630" y="575" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2a44">IN_REVIEW</text><rect x="1040" y="490" width="220" height="60" rx="26" fill="#e4f6ea" stroke="#1f2a44" stroke-width="2"/><text x="1150" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2a44">APPROVED</text><rect x="1040" y="620" width="260" height="60" rx="26" fill="#fdecec" stroke="#1f2a44" stroke-width="2"/><text x="1170" y="655" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2a44">REJECTED</text><path d="M 69 570 L 130 570" fill="none" stroke="#44516e" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="544" width="80" height="20" fill="white"/><text x="100" y="558" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">registered</text><path d="M 320 570 L 520 570" fill="none" stroke="#44516e" stroke-width="2" marker-end="url(#a)"/><rect x="342.6" y="544" width="154.79999999999998" height="20" fill="white"/><text x="420" y="558" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">mark ready for review</text><text x="420" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1f2a44">Developer / Lead</text><path d="M 740 560 L 1040 520" fill="none" stroke="#44516e" stroke-width="2" marker-end="url(#a)"/><rect x="785.4" y="506" width="209.2" height="20" fill="white"/><text x="890" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">approve (no blocking tickets)</text><text x="890" y="497" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1f2a44">Tester / Client; commit SHA recorded</text><path d="M 740 585 L 1040 645" fill="none" stroke="#44516e" stroke-width="2" marker-end="url(#a)"/><rect x="778.6" y="626" width="222.79999999999998" height="20" fill="white"/><text x="890" y="640" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-style="italic" fill="#44516e">request changes (note required)</text><text x="890" y="668" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1f2a44">Tester / Client; commit SHA recorded</text><text x="750" y="730" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-style="italic" fill="#44516e">A decided build cannot be decided again (409). Concurrent decisions are serialised with SELECT ... FOR UPDATE.</text></svg>