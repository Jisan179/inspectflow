g</text><ellipse cx="1130" cy="880" rx="128" ry="30" fill="#eef1f8" stroke="#1f2a44" stroke-width="1.6"/><text x="1130" y="877" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#1f2a44">Verify HMAC signature,</text><text x="1130" y="893" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="middle" fill="#1f2a44">ignore replays</text>
