<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790">
  <defs><marker id="m" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#44516e"/></marker></defs>
  <rect width="1440" height="790" fill="white"/><rect x="15" y="30" width="150" height="40" rx="8" fill="#1f2a44"/><text x="90" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Tester</text><line x1="90" y1="70" x2="90" y2="770" stroke="#9aa6c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="195" y="30" width="150" height="40" rx="8" fill="#1f2a44"/><text x="270" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Widget</text><line x1="270" y1="70" x2="270" y2="770" stroke="#9aa6c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="405" y="30" width="150" height="40" rx="8" fill="#1f2a44"/><text x="480" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">API</text><line x1="480" y1="70" x2="480" y2="770" stroke="#9aa6c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="625" y="30" width="150" height="40" rx="8" fill="#1f2a44"/><text x="700" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">PostgreSQL / Storage</text><line x1="700" y1="70" x2="700" y2="770" stroke="#9aa6c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="865" y="30" width="150" height="40" rx="8" fill="#1f2a44"/><text x="940" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Developer</text><line x1="940" y1="70" x2="940" y2="770" stroke="#9aa6c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="1055" y="30" width="150" height="40" rx="8" fill="#1f2a44"/><text x="1130" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">GitHub</text><line x1="1130" y1="70" x2="1130" y2="770" stroke="#9aa6c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="1245" y="30" width="150" height="40" rx="8" fill="#1f2a44"/><text x="1320" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Client</text><line x1="1320" y1="70" x2="1320" y2="770" stroke="#9aa6c4" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="90" y1="130" x2="270" y2="130" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="180" y="122" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">1  click Report issue, sign in</text><line x1="270" y1="180" x2="480" y2="180" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="375" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">2  POST /widget/login (project key + origin)</text><line x1="480" y1="230" x2="270" y2="230" stroke="#44516e" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#m)"/><text x="375" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">3  widget token (2 h, one project)</text><path d="M 270 266 h 56 v 28 h -56" fill="none" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="336" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#1f2a44">4  capture page, collected errors; blur + flatten image</text><line x1="270" y1="330" x2="480" y2="330" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="375" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">5  POST /reports (screenshot + evidence)</text><line x1="480" y1="380" x2="700" y2="380" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="590" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">6  validate, sanitise, store PNG, create ticket (one transaction)</text><line x1="940" y1="430" x2="480" y2="430" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="710" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">7  open ticket, link branch (Bearer JWT)</text><line x1="1130" y1="480" x2="480" y2="480" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="805" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">8  pull_request merged, X-Hub-Signature-256</text><line x1="480" y1="530" x2="700" y2="530" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="590" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">9  verify HMAC, insert delivery id, ticket to Resolved (one transaction)</text><line x1="90" y1="580" x2="480" y2="580" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="285" y="572" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">10 verify the fix</text><line x1="1320" y1="630" x2="480" y2="630" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="900" y="622" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">11 approve build (blocked while High/Blocker tickets are unverified)</text><line x1="480" y1="680" x2="700" y2="680" stroke="#44516e" stroke-width="1.8" marker-end="url(#m)"/><text x="590" y="672" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44">12 lock build row, store approval with commit SHA</text></svg>